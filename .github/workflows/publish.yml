name: Render and publish book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      # Python is here only to run the source checks. The book itself contains
      # no executable code cells, so Quarto needs no kernel. Adding a code chunk
      # to any .qmd means adding the matching setup step and an environment file.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sources
        run: |
          python -m pip install --quiet PyYAML
          python tools/validate.py

      - name: Render only (pull requests)
        if: github.event_name == 'pull_request'
        run: quarto render

      - name: Render and publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
