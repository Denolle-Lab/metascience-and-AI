<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold-set coder</title>
<!-- Template: tools/roadmap/app/gold_coder.html. Data is embedded by tools/roadmap/g09_human_coding_app.py, which builds
     one coder packet per coder (mode "coder", locked to that coder, only their papers, no metrics, no pairings)
     and one coordinator build (mode "coordinator", comparison only). Runs from disk, offline; nothing is sent anywhere. -->
<style>
:root{
  --bg:#f5f4f2; --panel:#ffffff; --ink:#153742; --muted:#5b6b70; --line:#d9d6d0; --accent:#0f4c5c; --accent-ink:#ffffff;
  --soft:#e8eff0; --warn:#8a5a00; --warn-bg:#fdf3dc; --err:#a1302b; --err-bg:#fbe7e5; --ok:#2e6b4f; --ok-bg:#e3f1ea;
  --build:#4b2e83; --test:#164d64; --decide:#85754d; --shade:rgba(10,20,25,.45);
  --serif:"Source Serif 4","Source Serif Pro",Georgia,serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10191c; --panel:#172429; --ink:#dfe8ea; --muted:#9aaaae; --line:#2b3b40; --accent:#5fa8b8; --accent-ink:#0b1416;
  --soft:#1d2f35; --warn:#f0c46a; --warn-bg:#3a2f12; --err:#f19a93; --err-bg:#3d1d1b; --ok:#8fd3b0; --ok-bg:#183327;
  --build:#a690d6; --test:#6fb3c9; --decide:#cdbb8c; --shade:rgba(0,0,0,.6); }}
:root[data-theme="dark"]{
  --bg:#10191c; --panel:#172429; --ink:#dfe8ea; --muted:#9aaaae; --line:#2b3b40; --accent:#5fa8b8; --accent-ink:#0b1416;
  --soft:#1d2f35; --warn:#f0c46a; --warn-bg:#3a2f12; --err:#f19a93; --err-bg:#3d1d1b; --ok:#8fd3b0; --ok-bg:#183327;
  --build:#a690d6; --test:#6fb3c9; --decide:#cdbb8c; --shade:rgba(0,0,0,.6); }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:22px} h2{font-size:19px;margin:0 0 6px} h3{font-size:16px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;padding:3px 6px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 7px;width:100%}
textarea{min-height:56px;resize:vertical}
select{padding:4px 6px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.small{font-size:12.5px;color:var(--muted)}
.def{font-size:12.5px;color:var(--muted);margin-top:3px;min-height:1em}
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header.top .sp{flex:1}
nav.tabs button{border:none;background:transparent;padding:6px 10px;border-bottom:2px solid transparent;border-radius:0}
nav.tabs button.on{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
main{padding:16px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-areas:"paper form checks";gap:14px;align-items:start}
.layout .paper{grid-area:paper} .layout #form{grid-area:form} .layout .checksbox{grid-area:checks}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 270px;grid-template-areas:"paper paper" "form checks"}.layout .paper{position:static!important;max-height:none}}
@media (max-width:760px){.layout{grid-template-columns:1fr;grid-template-areas:"paper" "checks" "form"}.side{position:static!important;max-height:none!important}}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.secnav a{display:flex;justify-content:space-between;padding:4px 8px;border-radius:5px;text-decoration:none;color:var(--ink);font-size:14px}
.secnav a:hover{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:6px;flex:none;align-self:center}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600}
.queue tr{cursor:pointer} .queue tr:hover td{background:var(--soft)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.step{display:grid;grid-template-columns:30px 150px 210px minmax(0,1fr) 84px;gap:6px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.step .row2{grid-column:2 / -1;display:grid;grid-template-columns:200px 120px minmax(0,1fr) auto;gap:6px}
@media (max-width:1000px){.step{grid-template-columns:30px 1fr 1fr}.step textarea[data-s="action"]{grid-column:2 / -1}.step input[data-s="page"]{grid-column:2 / -1}.step .row2{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.step,.step .row2{grid-template-columns:1fr}.step textarea[data-s="action"],.step input[data-s="page"],.step .row2{grid-column:auto}}
.step .n{font-weight:700;color:var(--muted);padding-top:6px}
.wc{font-size:11.5px;color:var(--muted);text-align:right} .wc.bad{color:var(--err);font-weight:600}
.strip{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:14px;color:#fff;font-weight:700;font-size:13px;padding:0 6px}
.chip.build{background:var(--build)} .chip.test{background:var(--test)} .chip.decide{background:var(--decide)} .chip.blank{background:var(--line);color:var(--muted)}
.msg{font-size:13px;padding:4px 8px;border-radius:5px;margin:3px 0}
.msg.err{background:var(--err-bg);color:var(--err)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:6px;padding:8px 10px;margin:6px 0 10px}
.listitem{border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
.rowflex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:0;color:var(--ink);font-size:13px;flex:1 1 170px;cursor:pointer}
.scale input{width:auto;margin-top:3px}
.checks label{display:inline-flex;gap:5px;align-items:center;margin-right:12px;color:var(--ink)}
.checks input{width:auto}
details summary{cursor:pointer;color:var(--accent);font-size:14px}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:14px}
.banner.err{background:var(--err-bg);color:var(--err)}
.center{max-width:760px;margin:30px auto}
.drop{border:2px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--accent);color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.tree td input{min-width:160px}
#drawer{position:fixed;inset:0;background:var(--shade);display:none;z-index:20}
#drawer.on{display:block}
#drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(720px,96vw);background:var(--bg);overflow:auto;padding:14px;box-shadow:-4px 0 20px rgba(0,0,0,.2)}
fieldset.ro{opacity:.6;pointer-events:none}
fieldset{border:none;margin:0;padding:0;min-width:0}
</style>
</head>
<body>
<script id="payload" type="application/json">/*__DATA__*/null</script>
<header class="top">
  <h1 id="apptitle">Gold-set coder</h1>
  <nav class="tabs" id="tabs"></nav>
  <span class="sp"></span>
  <span class="small" id="who"></span>
  <button class="ghost" id="themeBtn" title="Switch light or dark">◐</button>
</header>
<main id="app"></main>
<div id="drawer"><div class="panel"><div class="rowflex"><h2 style="flex:1">Codebook</h2><button id="drawerClose">Close</button></div><div id="drawerBody"></div></div></div>
<script>
(function(){
'use strict';
const P = JSON.parse(document.getElementById('payload').textContent || 'null');
const app = document.getElementById('app');
if(!P){ app.innerHTML = '<div class="center card"><h2>No data</h2><p>This is the template. Build the packets with <code>python tools/roadmap/g09_human_coding_app.py</code>.</p></div>'; return; }
const MODE_APP = P.mode;            // 'coder' or 'coordinator'
const TAB_ID = Math.random().toString(36).slice(2);

// ---------- storage ----------
let storageOk = true;
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ storageOk = false; showStorageBanner(); return false; } },
  keys(prefix){ try{ return Object.keys(localStorage).filter(k => k.startsWith(prefix)); }catch(e){ return []; } }
};
const NS = 'goldcoder.v2.' + (P.meta.packet || 'all') + '.';
storageOk = store.set(NS + 'probe', 1);
function showStorageBanner(){ const b = document.getElementById('storageBanner'); if(b) b.style.display = 'block'; }

// IndexedDB keeps the chosen save folder across reloads (Chrome and Edge)
const idb = {
  open(){ return new Promise((res, rej) => { try{ const r = indexedDB.open('goldcoder', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); },
  async get(k){ try{ const db = await this.open(); return await new Promise(res => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }); }catch(e){ return undefined; } },
  async set(k, v){ try{ const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); t.onsuccess = () => res(); t.onerror = () => res(); }); }catch(e){} }
};

// ---------- vocabulary ----------
const S = P.schema, RS = P.ratings_schema, SP = S.properties;
const NODE = Object.fromEntries(P.nodes.map(n => [n.id, n]));
const MODE = Object.fromEntries(P.modes.map(m => [m.id, m]));
const DEF = P.definitions || {};
const ENUM = {
  entryState: SP.entry.properties.state.enum, node: SP.entry.properties.node.enum,
  mode: SP.sequences.items.properties.steps.items.properties.mode.enum,
  move: SP.sequences.items.properties.steps.items.properties.move.enum,
  trigger: SP.sequences.items.properties.steps.items.properties.trigger.enum,
  treeQ: SP.tree.items.properties.question.enum, treeMode: SP.tree.items.properties.mode_called.enum,
  outcome: SP.end.properties.outcome.enum, status: SP.end.properties.claim_status.enum,
  composition: SP.composition.enum, gate: SP.gates.properties.action.enum,
  importKind: SP.imports.items.properties.kind.enum, disKind: SP.disagreements.items.properties.kind.enum,
  disStance: SP.disagreements.items.properties.stance.enum, effect: SP.alternatives_considered.items.properties.effect_reported.enum,
  vkind: SP.v_checks ? SP.v_checks.items.properties.kind.enum : [],
};
const PAGE_CONV = ['XML section and paragraph locators (jats_text)', 'XML locators, PDF pages for figure content', 'printed journal pages',
  'PDF pages counted from 1', 'printed article pages (e.g. "3 of 14")'];
const ROLES = ['corrective','enabling','integrative','cumulative','transformative'];
const RA = RS.properties.advance.properties;
const VERDICTS = RA.verdict ? RA.verdict.enum : [];
const CONDS = RA.unassessable_condition ? RA.unassessable_condition.enum.filter(x => x !== 'none') : [];
const CRITS = RA.verdict_criteria ? Object.keys(RA.verdict_criteria.properties) : [];
const HAS_VERDICT = VERDICTS.length > 0 && P.meta.ratings_version !== '1.0.0';
const NOTES = P.rating_notes || [];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lab = v => (DEF[v] && DEF[v].label) || String(v).replace(/_/g,' ');
const defOf = v => (DEF[v] && DEF[v].def) || '';
const words = s => (String(s||'').trim().match(/\S+/g) || []).length;
const localDate = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const coderName = id => (P.coders.find(c => c.id === id) || {}).name || id;
function hashStr(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16); }
const contentHash = d => hashStr(JSON.stringify(d.coding) + '|' + JSON.stringify(Object.assign({}, d.ratings, {rated_on: ''})));

// ---------- state ----------
const coder = MODE_APP === 'coder' ? P.coder : null;
let view = MODE_APP === 'coordinator' ? 'coord' : store.get(NS + 'view', 'queue');
let current = store.get(NS + 'current', null);
let dirHandle = null;
let D = null, saveTimer = null, pendingKey = null, readOnly = false, lastActive = 0;

function draftKey(k){ return NS + 'draft.' + coder + '.' + k; }
function emptyCoding(p){
  return { key:p.key, doi:p.doi, codebook_version:P.meta.codebook_version, coder: coderName(coder) + ' (' + coder + '), human',
    documents:['final paper'], pages_convention:'', entry:{state:'', node:'', evidence:'', page:''},
    sequences:[{kind:'final_paper', source_document:'final paper', steps:[]}], tree:[], end:{outcome:'', claim_status:'', claim:'', page:''},
    decisive_move:{node:'', mode:'', sentence:'', page:''}, composition:'', gates:{action:'', claim:'', registration:'', evidence:''},
    imports:[], novelty_claims:[], limits:'', disagreements:[], alternatives_considered:[], v_checks:[] };
}
function emptyRatings(p){
  return { key:p.key, doi:p.doi, ratings_version:P.meta.ratings_version, coder: coderName(coder) + ' (' + coder + ')', rated_on:'',
    minutes_spent:0, eligible_in_my_view:'', familiarity:'',
    novelty:{atomic_claim:'', claim_kind:'', closest_precedent:'', new_component:'', judgment:'', score:0, confidence:''},
    advance: Object.assign({starting_state:'', gain:'', magnitude:'', evidence:'', roles:[], score:0, confidence:''},
      HAS_VERDICT ? {verdict:'', verdict_reasons:'', unassessable_condition:'', verdict_criteria: Object.fromEntries(CRITS.map(k => [k, '']))} : {}),
    impact_forecast:'', notes:'' };
}
// the ratings file as saved: the condition is "none" unless unassessable; unassessable has no score and no criteria
function ratingsOut(r){
  const o = JSON.parse(JSON.stringify(r));
  if(!HAS_VERDICT) return o;
  o.ratings_version = P.meta.ratings_version;
  const a = o.advance;
  if(a.verdict === 'achieved' || a.verdict === 'not_demonstrated') a.unassessable_condition = 'none';
  if(a.verdict === 'unassessable'){ a.score = null; delete a.verdict_criteria; if(a.unassessable_condition === 'none') a.unassessable_condition = ''; }
  return o;
}
// the verdict the six criteria imply for the gain rated (section 6 of the advance rubric)
function impliedVerdict(a){
  const c = a.verdict_criteria || {};
  if(CRITS.some(k => !c[k])) return '';
  if(CRITS.some(k => c[k] === 'not_met')) return 'not_demonstrated';
  return 'achieved';
}
// fill any missing field from the empty template, so a partial draft can never break rendering
function fill(t, v){
  if(Array.isArray(t)) return Array.isArray(v) ? v : t;
  if(t && typeof t === 'object'){ const o = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {}; Object.keys(t).forEach(k => { o[k] = fill(t[k], o[k]); }); return o; }
  return (v === undefined || v === null || typeof v !== typeof t) ? t : v;
}
function newStep(){ return {n:0, node:'', mode:'', action:'', page:'', move:'', trigger:'', quote:''}; }
function normalize(d, p){
  d.coding = fill(emptyCoding(p), d.coding); d.ratings = fill(emptyRatings(p), d.ratings);
  d.coding.sequences = d.coding.sequences.filter(s => s && typeof s === 'object').map(s => ({kind: s.kind || 'review', source_document: s.source_document || '', steps: (Array.isArray(s.steps) ? s.steps : []).map(st => fill(newStep(), st))}));
  if(!d.coding.sequences.some(s => s.kind === 'final_paper')) d.coding.sequences.unshift({kind:'final_paper', source_document:'final paper', steps:[]});
  d.coding.tree = d.coding.tree.filter(t => t && typeof t === 'object').map(t => fill({question:'', answer:'', mode_called:''}, t));
  d.activeMs = d.activeMs || 0; return d;
}
function loadDraft(k){
  const p = P.papers.find(x => x.key === k);
  const d = store.get(draftKey(k), null);
  return normalize(d || {coding: emptyCoding(p), ratings: emptyRatings(p), started: new Date().toISOString(), savedFiles: null, activeMs: 0}, p);
}
function persist(){
  if(!D || readOnly) return;
  const k = pendingKey || current; pendingKey = null;
  D.updated = new Date().toISOString(); D.tab = TAB_ID;
  store.set(draftKey(k), D);
}
function touch(){ const now = Date.now(); if(D && now - lastActive < 120000) D.activeMs += now - lastActive; lastActive = now; }
function persistSoon(){ touch(); pendingKey = current; clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = null; persist(); refreshSide(); }, 250); }
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; persist(); } }
window.addEventListener('beforeunload', flush);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flush(); });
// another tab writing the same paper: stop editing here
window.addEventListener('storage', e => {
  if(!D || !current || view !== 'code' || e.key !== draftKey(current) || !e.newValue) return;
  let other; try{ other = JSON.parse(e.newValue); }catch(_){ return; }
  if(other.tab && other.tab !== TAB_ID){ readOnly = true; clearTimeout(saveTimer); saveTimer = null;
    const f = document.getElementById('formfs'); if(f) f.classList.add('ro');
    const b = document.getElementById('tabBanner'); if(b) b.style.display = 'block'; }
});

// ---------- validation ----------
function vSchema(schema, data, path, out){
  const t = schema.type;
  if(t === 'object'){
    if(typeof data !== 'object' || data === null || Array.isArray(data)){ out.push([path,'must be an object']); return; }
    (schema.required||[]).forEach(r => { if(!(r in data)) out.push([path.concat(r), 'is required']); });
    const props = schema.properties || {};
    Object.keys(data).forEach(k => { if(props[k]) vSchema(props[k], data[k], path.concat(k), out); else if(schema.additionalProperties === false) out.push([path.concat(k), 'is not allowed by the schema']); });
  } else if(t === 'array'){
    if(!Array.isArray(data)){ out.push([path,'must be a list']); return; }
    data.forEach((x,i) => vSchema(schema.items, x, path.concat(i), out));
  } else if(t === 'string'){
    if(typeof data !== 'string'){ out.push([path,'must be text']); return; }
    if(schema.enum && !schema.enum.includes(data)) out.push([path, data === '' ? 'choose a value' : 'is not an allowed value']);
  } else if(t === 'boolean'){
    if(typeof data !== 'boolean') out.push([path, 'choose yes or no']);
  } else if(t === 'integer'){
    if(!Number.isInteger(data)){ out.push([path,'must be a whole number']); return; }
    if(schema.minimum !== undefined && data < schema.minimum) out.push([path, schema.minimum === 1 ? 'choose a score' : 'must be at least ' + schema.minimum]);
    if(schema.maximum !== undefined && data > schema.maximum) out.push([path, 'must be at most ' + schema.maximum]);
  }
}
const SECOF = {pages_convention:'doc', documents:'doc', key:'doc', doi:'doc', codebook_version:'doc', coder:'doc', entry:'entry', sequences:'steps', tree:'tree',
  end:'end', decisive_move:'end', composition:'end', gates:'gates', imports:'extras', novelty_claims:'extras', limits:'extras', disagreements:'disagree', alternatives_considered:'disagree', v_checks:'vchecks'};
const LISTNAME = {imports:'Import', novelty_claims:'Novelty claim', disagreements:'Disagreement', alternatives_considered:'Alternative', v_checks:'V check'};
function friendly(path, c){
  const [a, b, x, y, z] = path;
  if(a === 'sequences'){ const s = c.sequences[b]; const tag = s && s.kind === 'final_paper' ? 'Final paper' : 'Review sequence';
    if(x === 'steps' && y !== undefined) return `${tag} step ${y+1}: ${String(z||'').replace(/_/g,' ')}`; return tag; }
  if(a === 'tree' && typeof b === 'number') return `Tree question ${(c.tree[b]||{}).question || b+1}: ${String(x||'').replace(/_/g,' ')}`;
  if(LISTNAME[a] && typeof b === 'number') return `${LISTNAME[a]} ${b+1}: ${String(x||'').replace(/_/g,' ')}`;
  return path.map(p => String(p).replace(/_/g,' ')).join(' › ');
}
function checkCoding(c){
  const out = [];
  const se = []; vSchema(S, c, [], se);
  se.forEach(([p,m]) => out.push({sec: SECOF[p[0]] || 'doc', level:'err', text: friendly(p, c) + ' ' + m}));
  const need = (v, where, sec, what) => { if(!String(v||'').trim()) out.push({sec, level:'err', text: where + ': ' + (what || 'location is missing (every claim carries a page or locator)')}); };
  need(c.pages_convention, 'Document', 'doc', 'state the page or locator convention');
  need(c.entry.page, 'Entry', 'entry'); need(c.entry.evidence, 'Entry', 'entry', 'quote the sentence that establishes the entry state');
  if(words(c.entry.evidence) > 25) out.push({sec:'entry', level:'err', text:'Entry evidence is ' + words(c.entry.evidence) + ' words (at most 25)'});
  if(c.sequences.filter(s => s.kind === 'final_paper').length !== 1) out.push({sec:'steps', level:'err', text:'Exactly one final-paper sequence is needed'});
  c.sequences.forEach(s => {
    const tag = s.kind === 'final_paper' ? 'Final paper' : 'Review sequence';
    if(!s.steps.length) out.push({sec:'steps', level:'err', text: tag + ': no steps yet'});
    s.steps.forEach((st, i) => {
      const w = tag + ' step ' + (i+1);
      need(st.page, w, 'steps'); need(st.action, w, 'steps', 'describe the action');
      if(words(st.quote) > 25) out.push({sec:'steps', level:'err', text: w + ': quote is ' + words(st.quote) + ' words (at most 25)'});
      if(st.move === 'repeat' && (i === 0 || s.steps[i-1].node !== st.node)) out.push({sec:'steps', level:'warn', text: w + ': "repeat" means the same node as the step just before'});
      if(i > 0 && st.node && s.steps[i-1].node === st.node && s.steps[i-1].mode === st.mode && st.move !== 'repeat' && st.move !== 'return_after_failure')
        out.push({sec:'steps', level:'warn', text: w + ': same node and mode as the step before; consecutive actions on the same node and mode are one step'});
      if(s.kind === 'final_paper' && ['review_forced','declined'].includes(st.move)) out.push({sec:'steps', level:'warn', text: w + ': in the final paper, code moves from the published text alone'});
      if(s.kind === 'final_paper' && ['referee','editor','commenter'].includes(st.trigger)) out.push({sec:'steps', level:'warn', text: w + ': a referee, editor or commenter trigger belongs in the review sequence'});
    });
  });
  const fp = c.sequences.find(s => s.kind === 'final_paper');
  if(fp && fp.steps.length){
    const n = fp.steps.length;
    if(n < 8 || n > 30) out.push({sec:'steps', level:'warn', text: n + ' steps. A letter usually has 8 to 20 and an article with Methods 12 to 30; check the granularity rule'});
    if(c.decisive_move.node && !fp.steps.some(s => s.node === c.decisive_move.node)) out.push({sec:'end', level:'warn', text:'The decisive move’s node does not appear in the final-paper steps'});
  }
  const qs = c.tree.map(t => t.question);
  if(new Set(qs).size !== qs.length) out.push({sec:'tree', level:'err', text:'A tree question is answered twice'});
  if(!c.tree.length) out.push({sec:'tree', level:'warn', text:'No tree question answered yet (record each question the paper answers)'});
  c.tree.forEach(t => need(t.answer, 'Tree question ' + t.question, 'tree', 'answer is empty'));
  need(c.end.page, 'End', 'end'); need(c.end.claim, 'End', 'end', 'state the claim in one sentence');
  need(c.decisive_move.page, 'Decisive move', 'end'); need(c.decisive_move.sentence, 'Decisive move', 'end', 'one sentence');
  need(c.gates.evidence, 'Gates', 'gates', 'give the evidence for the three answers');
  c.imports.forEach((x,i) => { need(x.field, 'Import ' + (i+1), 'extras', 'field is empty'); need(x.item, 'Import ' + (i+1), 'extras', 'item is empty'); need(x.page, 'Import ' + (i+1), 'extras'); });
  c.novelty_claims.forEach((x,i) => { need(x.quote, 'Novelty claim ' + (i+1), 'extras', 'quote is empty'); need(x.page, 'Novelty claim ' + (i+1), 'extras');
    if(words(x.quote) > 25) out.push({sec:'extras', level:'err', text:'Novelty claim ' + (i+1) + ' is over 25 words'}); });
  c.disagreements.forEach((x,i) => { const w = 'Disagreement ' + (i+1); need(x.target, w, 'disagree', 'target is empty'); need(x.support, w, 'disagree', 'support is empty');
    need(x.quote, w, 'disagree', 'quote is empty'); need(x.page, w, 'disagree'); if(words(x.quote) > 25) out.push({sec:'disagree', level:'err', text: w + ' quote is over 25 words'}); });
  c.alternatives_considered.forEach((x,i) => { const w = 'Alternative ' + (i+1); need(x.chosen, w, 'disagree', 'what was chosen is empty');
    need(x.alternatives, w, 'disagree', 'the alternatives are empty'); need(x.reason, w, 'disagree', 'reason is empty (write "none given" if the paper gives none)'); need(x.page, w, 'disagree'); });
  c.v_checks.forEach((x,i) => { const w = 'V check ' + (i+1); need(x.page, w, 'vchecks'); if(words(x.quote) > 25) out.push({sec:'vchecks', level:'err', text: w + ' quote is over 25 words'}); });
  const hasV = c.sequences.some(s => s.kind === 'final_paper' && s.steps.some(st => st.node === 'V'));
  if(hasV && !c.v_checks.some(x => x.performed_here === true)) out.push({sec:'vchecks', level:'err', text:'The final paper has V steps: list at least one check performed in this paper (section 3a)'});
  if(!hasV && c.v_checks.some(x => x.performed_here === true)) out.push({sec:'vchecks', level:'warn', text:'Checks performed here but no V step in the final paper: add the V step(s) or mark the checks as cited'});
  if(!String(c.limits||'').trim()) out.push({sec:'extras', level:'warn', text:'Limits: say what the paper does not show about its own process (or write "none noted")'});
  return out;
}
function checkRatings(r0){
  const r = ratingsOut(r0);
  const out = []; const se = []; vSchema(RS, r, [], se);
  se.forEach(([p,m]) => out.push({sec:'ratings', level:'err', text: p.map(x => String(x).replace(/_/g,' ')).join(' › ') + ' ' + m}));
  ['atomic_claim','closest_precedent','new_component'].forEach(f => { if(!String(r.novelty[f]||'').trim()) out.push({sec:'ratings', level:'err', text:'Novelty: ' + f.replace(/_/g,' ') + ' is empty'}); });
  ['starting_state','gain','magnitude','evidence'].forEach(f => { if(!String(r.advance[f]||'').trim()) out.push({sec:'ratings', level:'err', text:'Advance: ' + f.replace(/_/g,' ') + ' is empty'}); });
  if(!r.advance.roles.length) out.push({sec:'ratings', level:'err', text:'Advance: choose at least one contribution role'});
  if(!(r.minutes_spent > 0)) out.push({sec:'ratings', level:'err', text:'Minutes spent: enter the time you spent (the recorded active time is shown under the field)'});
  const a = r.advance, E = t => out.push({sec:'ratings', level:'err', text: t});
  if(!HAS_VERDICT){ if(!(a.score >= 1)) E('Advance score: choose a score'); return out; }
  if(a.verdict !== 'unassessable' && !(a.score >= 1)) E('Advance score: choose a score');
  if(!String(a.verdict_reasons||'').trim()) E('Verdict: give the reasons (two to four sentences naming the decisive criteria and the evidence, with locations)');
  if(a.verdict === 'achieved'){
    const iv = impliedVerdict(a);
    if(iv === 'not_demonstrated') E('Verdict achieved needs every criterion met (W3 may be not applicable): ' + CRITS.filter(k => a.verdict_criteria[k] === 'not_met').join(', ') + ' not met');
    if(a.score === 1) E('Achieved takes an advance score of 2 to 5 (a score of 1 means no warranted gain)');
  }
  if(a.verdict === 'not_demonstrated'){
    if(impliedVerdict(a) === 'achieved') E('Verdict not demonstrated needs at least one criterion not met; all six are met, so the verdict is achieved');
    if(a.score > 1) E('Not demonstrated takes an advance score of 1');
  }
  if(a.verdict === 'unassessable' && !CONDS.includes(a.unassessable_condition)) E('Unassessable: name the condition (U1 to U5)');
  if(r.eligible_in_my_view === 'no' && !(a.verdict === 'unassessable' && a.unassessable_condition === 'U4')) E('Eligibility is no: the verdict is unassessable, condition U4 (still complete every field)');
  if(a.unassessable_condition === 'U4' && r.eligible_in_my_view !== 'no') E('U4 means not a primary Earth-science research article: answer no to the eligibility question, or choose another condition');
  if(a.verdict === 'unassessable' && a.unassessable_condition === 'U5') out.push({sec:'ratings', level:'warn', text:'U5 is for use sparingly: say exactly what is missing in the verdict reasons'});
  return out;
}
function errorCount(d){ return checkCoding(d.coding).filter(x => x.level === 'err').length + checkRatings(d.ratings).filter(x => x.level === 'err').length; }
function paperStatus(k){
  const raw = store.get(draftKey(k), null);
  if(!raw) return {label:'not started', cls:''};
  const d = normalize(raw, P.papers.find(x => x.key === k)); const e = errorCount(d);
  const sv = d.savedFiles;
  if(sv && sv.complete && sv.hash === contentHash(d)) return {label: sv.how === 'folder' ? 'saved' : 'downloaded: move both files to my_codings', cls: sv.how === 'folder' ? 'ok' : 'warn'};
  if(sv && sv.hash !== contentHash(d)) return {label:'changed since last save', cls:'warn'};
  if(!e) return {label:'complete, not saved', cls:'warn'};
  return {label:'in progress (' + e + ' to fix)', cls:'err'};
}

function restoreBackup(ev){

    if(b.coder !== coder){ notice('That backup belongs to ' + coderName(b.coder) + ', not to you. Nothing was restored.', 'err'); return; }
    let taken = 0, kept = 0;
    Object.entries(b.drafts || {}).forEach(([k, d]) => {
      if(!P.order.includes(k) || !d) return;

      if(!local || (d.updated || '') > (local.updated || '')){ store.set(draftKey(k), d); taken++; } else kept++;

    render(); notice(`Restored ${taken} draft(s) from the backup; kept ${kept} newer draft(s) already in this browser.`);

}

  bindForm();

  if(focusSel){ const el = f.querySelector(focusSel); if(el){ el.focus({preventScroll:true}); el.scrollIntoView({block:'nearest'}); } }
  showActive();

function showActive(){ const el = document.getElementById('activeTime'); if(el && D) el.textContent = 'Recorded active time on this paper: ' + Math.round(D.activeMs / 60000) + ' min'; }
function scale(name, val, anchors, off){ return anchors.map((a,i) => `<label${off ? ' style="opacity:.45;cursor:default"' : ''}><input type="radio" name="sc-${name}" data-score="${name}" value="${i+1}" ${val===i+1?'checked':''} ${off?'disabled':''}><span><b>${i+1}</b> ${esc(a)}</span></label>`).join(''); }

    <div class="def">${k === 'M2' ? `<details><summary style="font-size:12.5px">by gain type</summary>${esc(defOf('crit_M2'))}</details>` : esc(defOf('crit_' + k))}</div></div>`).join('');
  return `<h3 style="margin-top:14px">Verdict</h3>
    <div class="hint">Decide first whether the paper can be assessed (U1 to U5). If it can, judge the six criteria for the gain written above, then the verdict. The verdict is achieved when that gain meets all six (W3 may be not applicable), and not demonstrated when every gain in the paper fails at least one. Unassessable is not a hedge for a hard case: if you can judge, judge, and lower the confidence.</div>
    <div class="grid3">${crit}</div>
    <div class="grid2" style="margin-top:6px"><div><label>Verdict</label><select data-verdict="1">${opt(VERDICTS, a.verdict, v => lab('verdict_' + v), CHOOSE)}</select><div class="def">${esc(a.verdict ? defOf('verdict_' + a.verdict) : '')}</div>
      ${iv && !un ? `<div class="small">Your criteria imply: <b>${esc(lab('verdict_' + iv))}</b></div>` : ''}</div>
    <div>${un ? `<label>Unassessable condition</label><select data-r="advance.unassessable_condition" data-cond="1">${opt(CONDS, a.unassessable_condition, v => lab('unassessable_' + v), CHOOSE)}</select><div class="def">${esc(a.unassessable_condition && a.unassessable_condition !== 'none' ? defOf('unassessable_' + a.unassessable_condition) : '')}</div>` : ''}</div></div>
    <label>Verdict reasons: two to four sentences naming the decisive criteria and the evidence, with locations</label><textarea data-r="advance.verdict_reasons">${esc(a.verdict_reasons)}</textarea>`;
}

    ${isFP ? '' : `<label class="small" style="margin:0">source document <input data-seqsrc="${si}" value="${esc(s.source_document)}" style="width:240px;display:inline-block"></label><button class="ghost" data-delseq="${si}">remove sequence</button>`}</div>
    ${s.steps.map((st, i) => `<div class="step" data-si="${si}" data-i="${i}"><div class="n">${i+1}</div>
      <select data-s="node" title="${st.node ? esc(NODE[st.node].desc) : 'node'}" aria-label="step ${i+1} node">${opt(ENUM.node, st.node, nodeLabel, 'node…')}</select>

        <div><input data-s="quote" data-wc="1" placeholder="quote, at most 25 words (or leave empty)" value="${esc(st.quote)}"><div class="wc"></div></div>
        <div class="rowflex" style="gap:2px"><button class="ghost" data-act="up" title="move up" aria-label="move step up">↑</button><button class="ghost" data-act="down" title="move down" aria-label="move step down">↓</button><button class="ghost" data-act="ins" title="insert a step below" aria-label="insert step below">+</button><button class="ghost" data-act="del" title="delete" aria-label="delete step">×</button></div></div></div>`).join('')}

function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; ks.slice(0,-1).forEach(k => o = o[k]); o[ks[ks.length-1]] = val; }
function wc(el){ const box = el.parentElement.querySelector('.wc') || el.nextElementSibling; if(box && box.classList && box.classList.contains('wc')){ const n = words(el.value); box.textContent = n + ' / 25 words'; box.classList.toggle('bad', n > 25); } }
const hasContent = o => Object.entries(o).some(([k, v]) => !['n','kind','source_document'].includes(k) && (Array.isArray(v) ? v.length : String(v||'').trim()));

  f.querySelectorAll('[data-r]').forEach(el => { const path = el.dataset.r; const ev = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, () => { let v = el.value; if(path === 'minutes_spent'){ v = Math.max(0, parseInt(v || '0', 10) || 0); } setPath(r, path, v); persistSoon(); }); });
  f.querySelectorAll('[data-score]').forEach(el => el.addEventListener('change', () => { r[el.dataset.score].score = parseInt(el.value, 10); persistSoon(); }));
  f.querySelectorAll('[data-crit]').forEach(el => el.addEventListener('change', () => { r.advance.verdict_criteria[el.dataset.crit] = el.value; rerender(`[data-crit="${el.dataset.crit}"]`); }));
  f.querySelectorAll('[data-verdict]').forEach(el => el.addEventListener('change', () => { const a = r.advance; a.verdict = el.value;
    if(a.verdict === 'unassessable'){ if(!CONDS.includes(a.unassessable_condition)) a.unassessable_condition = r.eligible_in_my_view === 'no' ? 'U4' : ''; }
    else a.unassessable_condition = a.verdict ? 'none' : '';
    rerender('[data-verdict]'); }));
  f.querySelectorAll('[data-cond]').forEach(el => el.addEventListener('change', () => { rerender('[data-cond]'); }));
  f.querySelectorAll('[data-role]').forEach(el => el.addEventListener('change', () => { const roles = new Set(r.advance.roles); el.checked ? roles.add(el.dataset.role) : roles.delete(el.dataset.role);
    r.advance.roles = ROLES.filter(x => roles.has(x)); persistSoon(); }));
}
function renumber(){ D.coding.sequences.forEach(s => s.steps.forEach((st,i) => st.n = i+1)); }

function refreshSide(){
  if(!D) return;
  const issues = checkCoding(D.coding).concat(checkRatings(D.ratings));
  const nav = document.getElementById('secnav');
  if(nav){ nav.innerHTML = SECTIONS.map(([id, t]) => { const mine = issues.filter(x => x.sec === id); const cls = mine.some(x => x.level === 'err') ? 'err' : (mine.length ? 'warn' : 'ok');
      return `<a href="#sec-${id}" data-sec="${id}"><span>${t}</span><span class="dot ${cls}" title="${mine.length} to check"></span></a>`; }).join('');
    nav.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById('sec-' + a.dataset.sec).scrollIntoView({behavior:'smooth', block:'start'}); }); }
  const fp = D.coding.sequences.find(s => s.kind === 'final_paper');
  const chips = fp ? fp.steps.map(st => st.node ? `<span class="chip ${NODE[st.node].group}" title="${esc(st.node + ' ' + NODE[st.node].verb + (st.mode ? ' · ' + modeLabel(st.mode) : ''))}">${st.node}</span>` : '<span class="chip blank">?</span>').join('') : '';
  const errs = issues.filter(x => x.level === 'err'), warns = issues.filter(x => x.level === 'warn');
  const box = document.getElementById('checks');
  if(box) box.innerHTML = `<h3>Walk (final paper)</h3><div class="small" style="margin:2px 0 6px">entry ${D.coding.entry.node ? `<span class="chip ${NODE[D.coding.entry.node].group}" style="height:22px;min-width:22px">${D.coding.entry.node}</span>` : '?'} · ${fp ? fp.steps.length : 0} steps</div>
    <div class="strip">${chips || '<span class="small">no steps yet</span>'}</div>
    <div class="small" style="margin-top:6px"><span class="chip build" style="height:14px;min-width:14px"></span> build and observe <span class="chip test" style="height:14px;min-width:14px"></span> test <span class="chip decide" style="height:14px;min-width:14px"></span> decide</div>
    <h3 style="margin-top:14px">Checks</h3>
    ${errs.length ? `<div class="small">${errs.length} to fix, ${warns.length} to check</div>` : '<div class="msg ok">No errors.' + (warns.length ? '' : ' Ready to save.') + '</div>'}
    ${errs.slice(0,40).map(x => `<div class="msg err">${esc(x.text)}</div>`).join('')}${errs.length > 40 ? `<div class="small">… and ${errs.length-40} more</div>` : ''}
    ${warns.map(x => `<div class="msg warn">${esc(x.text)}</div>`).join('')}`;
  const info = document.getElementById('saveInfo');
  if(info){ const sv = D.savedFiles; const changed = sv && sv.hash !== contentHash(D);
    info.innerHTML = sv ? `Last saved ${esc(sv.when.slice(0,16).replace('T',' '))} (${sv.how === 'folder' ? 'to ' + esc(sv.folder||'my_codings') : 'downloaded'}${sv.complete ? '' : ', as an unfinished draft'}).${changed ? ' <b style="color:var(--warn)">Changed since then: save again.</b>' : ''}` : (storageOk ? 'Draft kept in this browser; not saved to a file yet.' : '<b style="color:var(--err)">Draft NOT kept: storage blocked.</b>'); }
  showActive();
}

async function saveFiles(){
  flush(); renumber();
  const errs = errorCount(D);
  if(errs && !window.confirm(errs + ' problem(s) remain. Save an unfinished draft file (named .draft, not counted as done)?')) return;
  D.ratings.rated_on = localDate();
  const base = current + '.' + coder + (errs ? '.draft' : '');
  if(!dirHandle && window.showDirectoryPicker){ notice('Choose this packet’s my_codings folder once; the app will remember it.'); if(!(await pickFolder())) return; }
  let how = 'folder';
  const R = ratingsOut(D.ratings);
  const ok1 = await writeFolder(base + '.coding.json', D.coding), ok2 = ok1 && await writeFolder(base + '.ratings.json', R);
  if(!(ok1 && ok2)){ download(base + '.coding.json', D.coding); download(base + '.ratings.json', R); how = 'download'; }
  D.savedFiles = {when: new Date().toISOString(), how, folder: dirHandle ? dirHandle.name : null, complete: !errs, hash: contentHash(D)};
  persist(); renderForm(); refreshSide();
  if(how === 'download') notice('Saved as downloads. Move both files into my_codings. If the browser added "(1)" to a name, replace the older file and remove the "(1)".');
}
function importCoding(ev){
  const file = ev.target.files[0]; ev.target.value = ''; if(!file) return;
  file.text().then(t => {
    let obj; try{ obj = JSON.parse(t); }catch(e){ notice('That file is not JSON. Nothing was changed.', 'err'); return; }
    if(!obj || obj.key !== current){ notice('That file is for ' + (obj && obj.key) + ', not this paper. Nothing was changed.', 'err'); return; }
    if(!String(obj.coder || '').includes('(' + coder + ')')){ notice('That file was written by ' + (obj.coder || 'an unknown coder') + '. You can load only your own files, so codings stay independent. Nothing was changed.', 'err'); return; }
    const isR = !!obj.ratings_version, isC = !!obj.codebook_version;
    if(!isR && !isC){ notice('Not a coding or ratings file. Nothing was changed.', 'err'); return; }
    const p = P.papers.find(x => x.key === current);
    if(isR){ obj.ratings_version = P.meta.ratings_version; if(obj.advance && obj.advance.score === null) obj.advance.score = 0; D.ratings = fill(emptyRatings(p), obj); } else { obj.codebook_version = P.meta.codebook_version; D.coding = fill(emptyCoding(p), obj); }
    normalize(D, p); persist(); renderForm(); refreshSide(); notice('Loaded your ' + (isR ? 'ratings' : 'coding') + ' file; check the list on the right for anything to complete.');
  }).catch(() => notice('Could not read that file. Nothing was changed.', 'err'));
}

// ---------- help ----------
function helpHTML(){
  const dl = keys => `<table><tbody>${keys.map(k => `<tr><td style="width:190px"><b>${esc(lab(k))}</b></td><td>${esc(defOf(k))}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="card"><h2>Nodes of graph ${esc(P.meta.graph)}</h2><table><tbody>${P.nodes.map(n => `<tr><td style="width:56px"><span class="chip ${n.group}">${n.id}</span></td><td style="width:140px">${esc(n.verb)}</td><td>${esc(n.desc)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h2>The thirteen modes of inquiry</h2><table><tbody>${P.modes.map(m => `<tr><td style="width:230px"><b>${esc(m.title)}</b><div class="small">${esc(m.id)}</div></td><td>${esc(m.purpose)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h2>Entry states</h2>${dl(ENUM.entryState)}</div>
    <div class="card"><h2>Moves</h2>${dl(ENUM.move)}</div>
    <div class="card"><h2>Outcomes and claim status</h2>${dl(ENUM.outcome)}${dl(ENUM.status)}</div>
    <div class="card"><h2>Compositions</h2>${dl(ENUM.composition)}</div>
    <div class="card"><h2>Gates</h2>${dl(['gate_action','gate_claim','gate_registration'])}</div>
    ${HAS_VERDICT ? `<div class="card"><h2>Advance verdict</h2>${dl(VERDICTS.map(v => 'verdict_' + v))}<h3 style="margin-top:10px">Unassessable conditions</h3>${dl(CONDS.map(v => 'unassessable_' + v))}<h3 style="margin-top:10px">Criteria for the gain rated</h3>${dl(CRITS.map(k => 'crit_' + k))}</div>` : ''}
    ${NOTES.length ? `<div class="card"><h2>Notes that bind the ratings</h2><ul>${NOTES.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <div class="card"><h2>Hard cases</h2><ul>${(P.hard_cases||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card"><h2>Decision tree ${esc(P.meta.tree||'')}</h2><table><tbody>${P.questions.map(q => `<tr><td style="width:40px"><b>${esc(q.n)}</b></td><td>${esc(q.q)}<div class="small">${esc(q.sub)}</div></td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h2>How to work</h2><ol>
      <li>Read the whole paper once before coding. Then code the entry, the steps in the order the paper gives them, the tree, the end, and the rest.</li>
      <li>Code what the paper says the authors did, not what you think they did. Mark anything you infer in Limits.</li>
      <li>Rate novelty and advance after coding, without looking up the paper online. The app hides the journal and DOI; the PDF shows them. Judge the work, not the venue.</li>
      <li>Save both files into this packet’s <code>my_codings</code> folder. Do not discuss a paper with anyone until you have saved it.</li>
      <li>Disagreements are data: never revise a saved coding after talking with a co-coder. If you find your own mistake later, edit and save again, and say what changed in Limits.</li></ol>
      <p class="small">Codebook v${esc(P.meta.codebook_version)} · ratings v${esc(P.meta.ratings_version)} · built ${esc(P.meta.built)} from commit ${esc(P.meta.commit)}.</p></div>`;
}
function renderHelp(){ app.innerHTML = helpHTML(); }

// ---------- coordinator ----------
const runs = xs => xs.filter((x,i) => i === 0 || x !== xs[i-1]);
function editDist(a, b){ const d = Array.from({length:b.length+1}, (_,j) => j); for(let i=1;i<=a.length;i++){ let prev = d[0]; d[0] = i; for(let j=1;j<=b.length;j++){ const t = d[j]; d[j] = Math.min(d[j]+1, d[j-1]+1, prev + (a[i-1] !== b[j-1] ? 1 : 0)); prev = t; } } return d[b.length]; }
const jacc = (a, b) => { const A = new Set(a), B = new Set(b); const u = new Set([...A, ...B]); return u.size ? [...A].filter(x => B.has(x)).length / u.size : 1; };
function seqOf(c, f){ const s = (c.sequences||[]).find(s => s.kind === 'final_paper'); return s ? runs(s.steps.map(x => x[f])) : []; }
function agree(a, b){ const na = seqOf(a,'node'), nb = seqOf(b,'node'), ma = seqOf(a,'mode'), mb = seqOf(b,'mode');
  const sim = (x, y) => 1 - editDist(x, y) / Math.max(x.length, y.length, 1);
  return {entry_node: a.entry.node === b.entry.node, entry_state: a.entry.state === b.entry.state, outcome: a.end.outcome === b.end.outcome,
    decisive_mode: a.decisive_move.mode === b.decisive_move.mode, node_set_jaccard: jacc(na, nb), mode_set_jaccard: jacc(ma, mb),
    node_seq_similarity: sim(na, nb), mode_seq_similarity: sim(ma, mb), steps: [na.length, nb.length]}; }
const initials = s => (String(s||'').match(/\(([A-Z]{2,3})\)/) || [])[1] || String(s||'?');
let coordFiles = [], coordSkipped = [];
function renderCoord(){
  const cod = coordFiles.filter(x => x.kind === 'c'), rat = coordFiles.filter(x => x.kind === 'r');
  const byKey = {}; cod.forEach(x => ((byKey[x.obj.key] = byKey[x.obj.key] || {})[initials(x.obj.coder)] = x.obj));
  const pairs = [];
  Object.entries(byKey).forEach(([k, byC]) => { const cs = Object.keys(byC).sort(); for(let i=0;i<cs.length;i++) for(let j=i+1;j<cs.length;j++) pairs.push({key:k, ca:cs[i], cb:cs[j], a:byC[cs[i]], b:byC[cs[j]], m:agree(byC[cs[i]], byC[cs[j]])}); });
  const ratBy = {}; rat.forEach(x => ((ratBy[x.obj.key] = ratBy[x.obj.key] || {})[initials(x.obj.coder)] = x.obj));
  const mean = f => pairs.length ? pairs.reduce((s, p) => s + (typeof p.m[f] === 'boolean' ? +p.m[f] : p.m[f]), 0) / pairs.length : NaN;
  const fmt = x => Number.isNaN(x) ? 'n/a' : x.toFixed(2);
  const title = k => (P.papers.find(x => x.key === k) || {}).title || k;
  app.innerHTML = `<div class="card"><h2>Agreement between coders</h2>
    <p class="small">Drop the coders’ <code>.coding.json</code> and <code>.ratings.json</code> files (draft files are ignored). When a coder has two files for a paper, the more recently modified file wins. Metrics follow <code>tools/check_coding.py agree</code>. The analysis of record is <code>tools/roadmap/g11_human_agreement.py</code>, run on the committed files; this view is for progress checks.</p>
    <div class="drop" id="drop">Drop files here, or <label style="display:inline;color:var(--accent);cursor:pointer;text-decoration:underline">choose files<input type="file" id="files" multiple accept=".json" style="display:none"></label></div>
    <p class="small">${cod.length} codings and ${rat.length} ratings loaded; ${pairs.length} coder pairs.${coordSkipped.length ? ' Skipped: ' + esc(coordSkipped.join('; ')) : ''}</p></div>
    ${pairs.length ? `<div class="card"><h3>Mean over ${pairs.length} pairs</h3><div class="grid4">
      ${['entry_node','entry_state','outcome','decisive_mode','node_set_jaccard','mode_set_jaccard','node_seq_similarity','mode_seq_similarity'].map(f => `<div>${f.replace(/_/g,' ')} <b class="num">${fmt(mean(f))}</b></div>`).join('')}</div>
      <button id="csv" style="margin-top:10px">Download table (CSV)</button></div>
    <div class="card"><table><thead><tr><th>Paper</th><th>Coders</th><th>Entry</th><th>Outcome</th><th>Decisive mode</th><th>Node set</th><th>Node seq.</th><th>Steps</th><th>Novelty</th><th>Advance</th><th>Verdict</th></tr></thead><tbody>
      ${pairs.map(p => { const R = ratBy[p.key] || {}; const sc = (c, f) => R[c] && R[c][f].score != null ? R[c][f].score : '–'; const vd = c => R[c] && R[c].advance.verdict ? R[c].advance.verdict.replace(/_/g,' ') + (R[c].advance.verdict === 'unassessable' ? ' ' + R[c].advance.unassessable_condition : '') : '–'; return `<tr><td>${esc(title(p.key))}<div class="small">${esc(p.key)}</div></td><td>${esc(p.ca)} / ${esc(p.cb)}</td>
        <td>${p.m.entry_node ? '✓' : '✗'} ${esc(p.a.entry.node)}/${esc(p.b.entry.node)}</td><td>${p.m.outcome ? '✓' : '✗'}</td><td>${p.m.decisive_mode ? '✓' : '✗'}</td>
        <td class="num">${fmt(p.m.node_set_jaccard)}</td><td class="num">${fmt(p.m.node_seq_similarity)}</td><td class="num">${p.m.steps.join(' / ')}</td>
        <td class="num">${sc(p.ca,'novelty')} / ${sc(p.cb,'novelty')}</td><td class="num">${sc(p.ca,'advance')} / ${sc(p.cb,'advance')}</td><td class="small">${esc(vd(p.ca))} / ${esc(vd(p.cb))}</td></tr>`; }).join('')}</tbody></table></div>` : ''}`;
  const drop = document.getElementById('drop');
  const take = files => Promise.all([...files].filter(f => !/\.draft\./.test(f.name)).map(f => f.text().then(t => ({t, name: f.name, mod: f.lastModified})))).then(list => {
    list.forEach(({t, name, mod}) => { let o; try{ o = JSON.parse(t); }catch(e){ coordSkipped.push(name + ' (not JSON)'); return; }
      const okC = o && o.codebook_version && o.entry && o.end && o.decisive_move && Array.isArray(o.sequences), okR = o && o.ratings_version && o.novelty && o.advance;
      if(!o || !o.key || !(okC || okR)){ coordSkipped.push(name + ' (not a complete coding or ratings file)'); return; }
      const kind = okR ? 'r' : 'c', who = initials(o.coder);
      const prev = coordFiles.find(x => x.kind === kind && x.obj.key === o.key && initials(x.obj.coder) === who);
      if(prev && prev.mod > mod) return;
      coordFiles = coordFiles.filter(x => x !== prev); coordFiles.push({kind, obj:o, mod}); });
    renderCoord(); });
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); }; drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); take(e.dataTransfer.files); };
  document.getElementById('files').onchange = e => take(e.target.files);
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = document.getElementById('csv'); if(csv) csv.onclick = () => {
    const head = ['key','coder_a','coder_b','entry_node','entry_state','outcome','decisive_mode','node_set_jaccard','mode_set_jaccard','node_seq_similarity','mode_seq_similarity','steps_a','steps_b'];
    const lines = [head.join(',')].concat(pairs.map(p => [q(p.key), q(p.ca), q(p.cb), +p.m.entry_node, +p.m.entry_state, +p.m.outcome, +p.m.decisive_mode, p.m.node_set_jaccard, p.m.mode_set_jaccard, p.m.node_seq_similarity, p.m.mode_seq_similarity, p.m.steps[0], p.m.steps[1]].join(',')));
    const blob = new Blob([lines.join('\n') + '\n'], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gold-agreement.' + localDate() + '.csv'; a.click(); };
}

(async () => { if(MODE_APP === 'coder') await restoreHandle(); render(); })();
})();
</script>
