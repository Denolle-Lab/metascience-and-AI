project:
  type: book
  output-dir: _book
book:
  title: MetaScience, Scientific Inquiry, and Agents
  subtitle: Denolle Lab research-group seminar | Fall 2026
  author: Denolle Lab, University of Washington
  date: last-modified
  site-url: https://denolle-lab.github.io/metascience-and-AI/
  repo-url: https://github.com/Denolle-Lab/metascience-and-AI
  repo-branch: main
  repo-actions:
  - edit
  - issue
  description: A thirteen-week reading seminar reconstructing how research actually
    proceeds, and translating those lessons into agent designs and evaluations that
    can be checked.
  favicon: favicon.svg
  chapters:
  - index.qmd
  - part: Inquiry in practice
    chapters:
    - sessions/01-scientific-method.qmd
    - sessions/02-exploratory-experiments.qmd
    - sessions/03-historical-traces.qmd
    - sessions/04-tectonic-synthesis.qmd
    - sessions/05-measurement.qmd
    - sessions/06-exploration-confirmation.qmd
    - sessions/07-field-marine.qmd
    - sessions/08-serendipity.qmd
    - sessions/09-model-tests.qmd
  - part: Novelty, advance, breadth, and agents
    chapters:
    - sessions/10-novelty.qmd
    - sessions/11-scientific-advance.qmd
    - sessions/12-polymathy.qmd
    - sessions/13-agent-design-and-evaluation.qmd
  - part: Working materials
    chapters:
    - rubrics.qmd
    - prior-art.qmd
    - reading-library.qmd
  - part: Group workspace
    chapters:
    - notes.qmd
    - suggested-readings.qmd
    - contributing.qmd
  - references.qmd
  sidebar:
    search: true
  page-footer:
    left: Working curriculum v0.3
    center: '[CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    right: '[Denolle Lab](https://denolle-lab.github.io/)'
bibliography: references.bib
link-citations: true
format:
  html:
    theme:
    - cosmo
    - styles.scss
    toc: true
    number-sections: false
    code-copy: true
    link-external-newwindow: true
lang: en
execute:
  freeze: true
