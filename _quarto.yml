project:
  type: book
  output-dir: _book
  resources:
    - slides/
    - evaluate/
book:
  title: MetaScience, Scientific Inquiry, and Agents
  subtitle: Scientific advance through plural inquiry
  author: Denolle Lab, University of Washington
  date: last-modified
  site-url: https://denolle-lab.github.io/metascience-and-AI/
  repo-url: https://github.com/Denolle-Lab/metascience-and-AI
  repo-branch: main
  repo-actions:
  - edit
  - issue
  description: A thirteen-meeting reading club studying scientific advance through plural
    epistemic modes, and designing agents evaluated against documented scientific work.
  favicon: favicon.svg
  chapters:
  - index.qmd
  - part: Defining the modes of inquiry
    chapters:
    - glossary.qmd
    - modes.qmd
    - modes/question.qmd
    - modes/observation.qmd
    - modes/exploration.qmd
    - modes/hypothesis.qmd
    - modes/theory.qmd
    - modes/simulation.qmd
    - modes/instruments.qmd
    - modes/methods.qmd
    - modes/synthesis.qmd
    - modes/reconstruction.qmd
    - modes/robustness.qmd
    - modes/estimation.qmd
    - modes/regularities.qmd
  - part: The graph of inquiry
    chapters:
    - unit.qmd
    - walks.qmd
    - decision-tree.qmd
  - part: Outcomes and test cases
    chapters:
    - metrics.qmd
    - success-set.qmd
    - inquirygraph.qmd
    - review-visibility.qmd
    - rubrics.qmd
  - part: Meetings held
    chapters:
    - sessions/01-scientific-method.qmd
    - sessions/10-novelty.qmd
    - notes.qmd
  - bibliography.qmd
  sidebar:
    search: true
  page-footer:
    left: Working curriculum v0.4
    center: '[CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    right: '[Denolle Lab](https://denolle-lab.github.io/)'
bibliography: references.bib
link-citations: true
format:
  html:
    theme:
    - cosmo
    - styles.scss
    include-in-header:
    - text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
    include-after-body:
    - file: assets/part-color.html
    toc: true
    number-sections: false
    code-copy: true
    link-external-newwindow: true
lang: en
execute:
  freeze: true
